<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in – SafeStreet AI</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --asphalt: #1b2430;
        --line: #f6c90e;
        --paper: #f3f4f1;
        --ink: #1b2430;
        --muted: #5d6877;
        --rule: #d9ddd6;
        --good: #1f8a5b;
        --err: #c0392b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Source Sans 3", system-ui, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--paper);
        line-height: 1.5;
      }
      h1,
      h2,
      h3,
      .brand,
      button,
      .btn {
        font-family: "Archivo", system-ui, sans-serif;
      }
      :focus-visible {
        outline: 3px solid var(--line);
        outline-offset: 2px;
      }
      a {
        color: inherit;
      }
      .brand {
        font-weight: 800;
        font-size: 1.4rem;
        text-decoration: none;
      }
      .brand span {
        color: var(--line);
      }
      .btn {
        display: inline-block;
        padding: 13px 22px;
        border-radius: 8px;
        font-weight: 800;
        text-decoration: none;
        border: 0;
        cursor: pointer;
        font-size: 1rem;
      }
      .btn.y {
        background: var(--line);
        color: var(--ink);
      }
      .btn.o {
        border: 2px solid #fff;
        color: #fff;
      }
      .btn.d {
        background: var(--asphalt);
        color: #fff;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 18px 6vw;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 4px solid var(--line);
        background: var(--asphalt);
        color: #fff;
      }
      header a.back {
        font-weight: 600;
        text-decoration: none;
        color: #c9d1dc;
      }
      main {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 36px 20px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--rule);
        border-radius: 14px;
        padding: 32px;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 6px 24px rgba(27, 36, 48, 0.08);
      }
      h1 {
        font-size: 1.8rem;
        margin-bottom: 4px;
      }
      .sub {
        color: var(--muted);
        margin-bottom: 22px;
      }
      .roles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: #e2e5e0;
        border-radius: 10px;
        padding: 4px;
        margin-bottom: 22px;
      }
      .roles button {
        border: 0;
        background: none;
        padding: 11px 8px;
        border-radius: 7px;
        cursor: pointer;
        font-weight: 700;
        font-size: 1rem;
        color: var(--muted);
      }
      .roles button[aria-selected="true"] {
        background: var(--asphalt);
        color: #fff;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .field {
        margin-bottom: 18px;
      }
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 13px 14px;
        font: inherit;
        border: 1.5px solid #b9c0ca;
        border-radius: 8px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.95rem;
        margin-bottom: 20px;
      }
      .row a {
        font-weight: 600;
      }
      .submit {
        width: 100%;
        background: var(--line);
        color: var(--ink);
      }
      .msg {
        min-height: 1.4em;
        margin-top: 14px;
        font-weight: 600;
      }
      .msg.err {
        color: var(--err);
      }
      .msg.ok {
        color: var(--good);
      }
      .alt {
        margin-top: 20px;
        text-align: center;
        color: var(--muted);
      }
      .alt a {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="index.html">Safe<span>Street</span> AI</a
      ><a class="back" href="index.html">&larr; Back to home</a>
    </header>
    <main>
      <div class="card">
        <h1>Log in</h1>
        <p class="sub" id="sub">Check the status of the issues you reported.</p>
        <div class="roles" role="tablist" aria-label="Choose how you log in">
          <button role="tab" aria-selected="true" data-role="citizen">
            Citizen
          </button>
          <button role="tab" aria-selected="false" data-role="admin">
            Admin
          </button>
        </div>
        <form id="f" novalidate>
          <div class="field">
            <label for="email" id="el">Email</label>
            <input
              type="email"
              id="email"
              autocomplete="username"
              placeholder="you@example.com"
            />
          </div>
          <div class="field">
            <label for="pw">Password</label>
            <input
              type="password"
              id="pw"
              autocomplete="current-password"
              placeholder="At least 6 characters"/>
          </div>
          <div class="row">
            <span
              ><input type="checkbox" id="rm" />
              <label for="rm" style="display: inline; font-weight: 400"
                >Keep me logged in</label
              ></span
            ><a href="#">Forgot password?</a>
          </div>
          <button type="submit" class="btn submit" id="go">
            Log in as citizen
          </button>
          <div class="msg" id="msg" role="status" aria-live="polite"></div>
        </form>
        <p class="alt" id="alt">
          New here? <a href="register.html">Create a citizen account</a>
        </p>
      </div>
    </main>
    <script>
      var role = "citizen",
        $ = (id) => document.getElementById(id);
      var T = {
        citizen: {
          sub: "Check the status of the issues you reported.",
          el: "Email",
          ph: "you@example.com",
          btn: "Log in as citizen",
          alt: 'New here? <a href="register.html">Create a citizen account</a>',
        },
        admin: {
          sub: "Review reports, update status and see city analytics.",
          el: "Official email",
          ph: "name@city.gov.in",
          btn: "Log in as admin",
          alt: "Admin accounts are created by your department head.",
        },
      };
      function setRole(r) {
        role = r;
        document
          .querySelectorAll(".roles button")
          .forEach((b) =>
            b.setAttribute("aria-selected", b.dataset.role === r),
          );
        var t = T[r];
        $("sub").textContent = t.sub;
        $("el").textContent = t.el;
        $("email").placeholder = t.ph;
        $("go").textContent = t.btn;
        $("alt").innerHTML = t.alt;
        $("msg").textContent = "";
      }
      document
        .querySelectorAll(".roles button")
        .forEach((b) =>
          b.addEventListener("click", () => setRole(b.dataset.role)),
        );
      if (new URLSearchParams(location.search).get("role") === "admin")
        setRole("admin");
      $("f").addEventListener("submit", (e) => {
        e.preventDefault();
        var m = $("msg");
        m.className = "msg err";
        if (!/^\S+@\S+\.\S+$/.test($("email").value.trim())) {
          m.textContent = "Enter a valid email address.";
          return;
        }
        if ($("pw").value.length < 6) {
          m.textContent = "Password must be at least 6 characters.";
          return;
        }
        /* TODO: replace with a real call, e.g. fetch("/api/auth/login", { method:"POST", body: JSON.stringify({ email, password, role }) }) */
        m.className = "msg ok";
        m.textContent = "Logged in as " + role + ". Redirecting...";
        setTimeout(() => {
          location.href =
            role === "admin"
              ? "admin-dashboard.html"
              : "citizen-dashboard.html";
        }, 900);
      });
    </script>
  </body>
</html>
